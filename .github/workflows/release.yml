name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest
      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          IMAGE_TAG="${GITHUB_REF_NAME#v}"
          NOTES="Docker image: ghcr.io/darticusmaximus/home-pantry:${IMAGE_TAG}

          Run it:

          docker run -d -p 3000:3000 \\
            -e NEXT_PUBLIC_APPWRITE_ENDPOINT=https://your-appwrite.example/v1 \\
            -e NEXT_PUBLIC_APPWRITE_PROJECT_ID=your-project-id \\
            -e AI_API_KEY=your-key \\
            ghcr.io/darticusmaximus/home-pantry:${IMAGE_TAG}

          See docs/self-hosting.md for the full runbook."
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes "$NOTES"
